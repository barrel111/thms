title: thms
author: barrel111
version: 1.1.0
quarto-required: ">=1.7.0"
contributes:
  filters:
    - thms.lua
  formats:
    html:
      theme: [default, thms.scss]
      crossref:
        custom:
          - kind: float
            key: prb
            reference-prefix: Problem
            caption-location: top
      filters:
        - path: thms.lua
          at: pre-ast
        - path: problem-refs.lua
          at: post-render

